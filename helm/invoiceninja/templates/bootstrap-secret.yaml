{{- if .Values.bootstrap.enabled }}
{{- $secretName := printf "%s-bootstrap" (include "invoiceninja.fullname" .) }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "invoiceninja.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
{{- if $secret }}
# Secret already exists, preserve the existing password
data:
  BOOTSTRAP_EMAIL: {{ $secret.data.BOOTSTRAP_EMAIL }}
  BOOTSTRAP_PASSWORD: {{ $secret.data.BOOTSTRAP_PASSWORD }}
{{- else }}
# Generate new random password on first install
stringData:
  BOOTSTRAP_EMAIL: {{ .Values.bootstrap.adminEmail | quote }}
  BOOTSTRAP_PASSWORD: {{ randAlphaNum 32 | quote }}
{{- end }}
{{- end }}
