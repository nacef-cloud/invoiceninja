apiVersion: v1
kind: Secret
metadata:
  name: {{ include "invoiceninja.fullname" . }}-secret
  labels:
    {{- include "invoiceninja.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Application key
  {{- if .Values.app.key }}
  APP_KEY: {{ .Values.app.key | quote }}
  {{- else }}
  # If not provided, generate a placeholder (should be set after first install)
  APP_KEY: "base64:CHANGEME_GENERATE_WITH_php_artisan_key_generate"
  {{- end }}

  # Database credentials
  {{- if .Values.mysql.enabled }}
  DB_USERNAME: {{ .Values.mysql.auth.username | quote }}
  DB_PASSWORD: {{ .Values.mysql.auth.password | quote }}
  {{- else }}
  DB_USERNAME: {{ .Values.database.username | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
  {{- end }}

  # Redis password
  {{- if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
  {{- else }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  {{- end }}

  # S3/MinIO credentials
  {{- if .Values.minio.enabled }}
  AWS_ACCESS_KEY_ID: {{ .Values.minio.auth.rootUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.minio.auth.rootPassword | quote }}
  {{- else }}
  AWS_ACCESS_KEY_ID: {{ .Values.storage.s3.key | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.storage.s3.secret | quote }}
  {{- end }}

  # Mail credentials
  {{- if .Values.mail.username }}
  MAIL_USERNAME: {{ .Values.mail.username | quote }}
  MAIL_PASSWORD: {{ .Values.mail.password | quote }}
  {{- end }}
