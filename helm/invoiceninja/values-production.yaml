# Production values override for Invoice Ninja
# Usage: helm install invoiceninja ./helm/invoiceninja -f ./helm/invoiceninja/values-production.yaml

# Cleanup configuration - preserve resources for audit and troubleshooting
cleanup:
  onUninstall:
    # Keep bootstrap job to view logs and verify what was configured
    bootstrapJob: false
    # Keep bootstrap secret to retrieve admin password later
    bootstrapSecret: false
    # Keep PVCs to preserve all data (must also set resourcePolicy below)
    pvcs: false

# MySQL persistence - keep data on uninstall
mysql:
  primary:
    persistence:
      resourcePolicy: "keep"

# Redis persistence - keep cache data on uninstall
redis:
  master:
    persistence:
      resourcePolicy: "keep"

# MinIO persistence - keep uploaded files on uninstall
minio:
  persistence:
    resourcePolicy: "keep"

